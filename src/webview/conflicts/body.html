<header>
  <h1 id="title"></h1>
  <p id="detail" class="detail"></p>
  <dl class="legend">
    <dt class="current">Current</dt>
    <dd id="current"></dd>
    <dt class="incoming">Incoming</dt>
    <dd id="incoming"></dd>
  </dl>
</header>
<main id="files" class="files"></main>
<footer>
  <div id="status" class="status" role="status"></div>
  <div class="buttons">
    <button id="continue">Continue</button>
    <button id="skip" title="Leave this commit out and go on with the next one">Skip This Commit</button>
    <button id="abort" title="Stop and put everything back as it was before">Abort</button>
  </div>
</footer>
