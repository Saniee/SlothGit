<div class="branch">
  <span id="name" class="name"></span>
  <span id="upstream" class="upstream"></span>
  <button id="fetch" class="icon-button" title="Fetch" aria-label="Fetch">&#x21bb;</button>
</div>
<!-- data-vscode-context: right-clicking a button opens the same menu natively (package.json webview/context). -->
<div id="buttons" class="buttons">
  <div class="split" data-menu="pull" data-vscode-context='{"webviewSection":"pull","preventDefaultContextMenuItems":true}'>
    <button class="main" data-command="slothgit.sync.pull"></button>
    <button class="more" title="More Pull Actions" aria-label="More Pull Actions">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7.976 10.072l4.357-4.357.62.618L8.284 11h-.618L3 6.333l.619-.618 4.357 4.357z"/></svg>
    </button>
  </div>
  <div class="split" data-menu="push" data-vscode-context='{"webviewSection":"push","preventDefaultContextMenuItems":true}'>
    <button class="main" data-command="slothgit.sync.push"></button>
    <button class="more" title="More Push Actions" aria-label="More Push Actions">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M7.976 10.072l4.357-4.357.62.618L8.284 11h-.618L3 6.333l.619-.618 4.357 4.357z"/></svg>
    </button>
  </div>
</div>
