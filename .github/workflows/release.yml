# Builds the extension and attaches the .vsix to a GitHub Release when a version tag is pushed.
# Nothing is published to the Marketplace.
#
#   1. Set "version" in package.json (e.g. 0.1.0) and commit.
#   2. git tag 0.1.0 && git push origin 0.1.0     (a "v" prefix works too: v0.1.0)
#
# Tags with a suffix (0.1.0-beta.1) become pre-releases.
name: Release

on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected ${version} or v${version})."
            exit 1
          fi

      - run: npm ci

      - name: Test
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          npm run typecheck
          npm test

      - name: Package
        # --skip-license: the repository has no LICENSE file yet.
        run: npx vsce package --skip-license --out "codegit-${GITHUB_REF_NAME#v}.vsix"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then prerelease="--prerelease"; fi
          # Release notes: this version's section of CHANGELOG.md, or GitHub's generated notes when it has none.
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if [[ -s notes.md ]]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "${GITHUB_REF_NAME}" codegit-*.vsix \
            --title "CodeGit ${GITHUB_REF_NAME}" \
            "${notes[@]}" \
            ${prerelease}
